worker_processes auto;

events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream backend_upstream {
        zone backend_upstream 64k;
        server backend:8000 resolve;
    }

    upstream bot_upstream {
        zone bot_upstream 64k;
        server bot:8080 resolve;
    }

    upstream frontend_upstream {
        zone frontend_upstream 64k;
        server frontend:3000 resolve;
    }

    server {
        listen 80;
        client_max_body_size 20m;

        location = /bot/health {
            proxy_pass http://bot_upstream/health;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /bot/ {
            proxy_pass http://bot_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            proxy_pass http://backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /health {
            proxy_pass http://backend_upstream/health;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # /media/products/<id>.jpg -> bucket products, key products/<id>.jpg
        location /media/ {
            proxy_pass http://minio:9000/products/;
            proxy_set_header Host minio:9000;
        }

        location / {
            proxy_pass http://frontend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}

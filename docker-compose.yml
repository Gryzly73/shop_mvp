name: shop_mvp

x-postgres-env: &postgres-env
  POSTGRES_DB: ${POSTGRES_DB}
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
  POSTGRES_PORT: ${POSTGRES_PORT:-5432}

x-minio-env: &minio-env
  MINIO_ROOT_USER: ${MINIO_ROOT_USER}
  MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio:
    image: ${MINIO_IMAGE:-minio/minio:RELEASE.2024-12-18T13-15-44Z}
    command: server /data --console-address ":9001"
    environment:
      <<: *minio-env
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    restart: unless-stopped

  # Одноразовый сервис: создаёт бакет и открывает анонимное чтение.
  # Без аргументов выполняет инициализацию; с аргументами запускает их как команду,
  # например: docker compose run --rm minio-init mc ls local/products
  # Образ minio/minio уже содержит mc; отдельный minio/mc больше не публикуется в Docker Hub.
  minio-init:
    image: ${MINIO_IMAGE:-minio/minio:RELEASE.2024-12-18T13-15-44Z}
    depends_on:
      - minio
    environment:
      MC_HOST_local: http://${MINIO_ROOT_USER}:${MINIO_ROOT_PASSWORD}@minio:9000
      S3_BUCKET: ${S3_BUCKET}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        i=0
        until mc ready local >/dev/null 2>&1; do
          i=$$((i + 1))
          if [ "$$i" -ge 60 ]; then echo "minio is not ready" >&2; exit 1; fi
          sleep 1
        done
        if [ "$$#" -gt 0 ]; then exec "$$@"; fi
        mc mb --ignore-existing "local/$${S3_BUCKET}"
        mc anonymous set download "local/$${S3_BUCKET}"
        echo "bucket $${S3_BUCKET} is ready"
      - --
    restart: "no"

  migrate:
    build: ./backend
    environment:
      <<: *postgres-env
      DATABASE_URL: ${DATABASE_URL:-}
    command: ["uv", "run", "--no-dev", "--frozen", "alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build: ./backend
    environment:
      <<: [*postgres-env, *minio-env]
      APP_ENV: ${APP_ENV:-development}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_BUCKET: ${S3_BUCKET}
      PUBLIC_MEDIA_URL: ${PUBLIC_MEDIA_URL}
      SERVICE_TOKEN: ${SERVICE_TOKEN}
      DATABASE_URL: ${DATABASE_URL:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 15s
    restart: unless-stopped

  bot:
    build: ./bot
    environment:
      APP_ENV: ${APP_ENV:-development}
      BOT_TOKEN: ${BOT_TOKEN}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
      ADMIN_IDS: ${ADMIN_IDS}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      SERVICE_TOKEN: ${SERVICE_TOKEN}
      BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL}
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 15s
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL}
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 15s
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      backend:
        condition: service_healthy
      bot:
        condition: service_healthy
      frontend:
        condition: service_healthy
    # Локально: 80:80. С Caddy: NGINX_PORT_MAPPING=127.0.0.1:8080:80 (см. docker-compose.caddy.yml).
    ports:
      - "${NGINX_PORT_MAPPING:-80:80}"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
